---
title: AWS Secrets Manager
summary: Fetch secrets from AWS Secrets Manager and export them as environment variables.
description: |-
  Fetches secrets from AWS Secrets Manager and loads them into Environment Variables
  for subsequent Steps.

  ### Authentication

  Supports these auth paths:

  1. **Ambient credentials only** — if `AWS_ACCESS_KEY_ID` is already set (e.g.
     after Authenticate with AWS) and `account`/`role_name` are omitted, the Step
     uses those credentials as-is (no second AssumeRole).
  2. **Ambient + AssumeRole** — if ambient `AWS_*` exist and both `account` and
     `role_name` are set, assumes that role via STS `AssumeRole`. If the ambient
     credentials already are that role, the assume is skipped.
  3. **OIDC** — if no ambient creds, `audience` is set, and both `account` and
     `role_name` are set → Bitrise OIDC + `AssumeRoleWithWebIdentity`.
  4. **Access keys** — static keys, optionally followed by AssumeRole when
     `account`/`role_name` are set.

  When a role was assumed, prior AWS credentials are restored after secrets are
  exported so later Steps (e.g. S3 upload) keep working.

  ### Secret line format

  - All keys: `PREFIX,secret-id` or `secret-id`
  - Selective keys: `PREFIX,secret-id,key1|key2|key3`

  See the Step README for examples.
website: https://github.com/momenshataly/aws-secrets-manager
source_code_url: https://github.com/momenshataly/aws-secrets-manager
support_url: https://github.com/momenshataly/aws-secrets-manager/issues

type_tags:
- utility

is_requires_admin_user: false
is_always_run: false
is_skippable: false

toolkit:
  bash:
    entry_file: step.sh

deps:
  brew:
  - name: jq
  - name: awscli
  apt_get:
  - name: jq
  - name: curl
  - name: unzip

inputs:
- secrets:
  opts:
    title: Secrets
    summary: List of secret IDs with optional env prefix and selective key list.
    description: |-
      One secret per line.

      - Standard (all keys): `PREFIX,secret-id` or `secret-id`
      - Selective keys: `PREFIX,secret-id,key1|key2|key3`

      Secret-id must not contain a comma. Selective key names are pipe-separated.
    is_required: true

- account:
  opts:
    title: AWS account
    summary: AWS account ID for optional role assume (with role_name).
    description: |-
      Numeric AWS account ID used to build the role ARN:
      `arn:aws:iam::{account}:role/{role_name}`.

      Optional. Omit together with `role_name` to use ambient AWS credentials
      (e.g. after Authenticate with AWS). Required together with `role_name`
      when this Step should assume a role.
    is_required: false

- region:
  opts:
    title: AWS region
    summary: AWS region containing the secrets.
    description: |-
      Exported as `AWS_REGION` / `AWS_DEFAULT_REGION`, e.g. `eu-west-1`.

      Required, with no fallback: Authenticate with AWS does not export the
      region it authenticated in, and an implicit region targets a different
      endpoint, which IAM policies scoped per region reject as
      `AccessDeniedException` on `GetSecretValue`.
    is_required: true

- role_name:
  opts:
    title: IAM role name
    summary: IAM role to assume (optional; pair with account).
    description: |-
      Builds `arn:aws:iam::{account}:role/{role_name}`.

      Optional. Omit together with `account` to use ambient AWS credentials.
      Required together with `account` when assuming a role.

      For Bitrise OIDC the role must trust `token.builds.bitrise.io`.
    is_required: false

- name_transformation: uppercase
  opts:
    title: Name transformation
    summary: How to transform secret keys into environment variable names.
    value_options:
    - uppercase
    - lowercase
    - none

- parse_json_secrets: "true"
  opts:
    title: Parse JSON secrets
    summary: Create one env var per JSON key when the secret value is a JSON object.
    value_options:
    - "true"
    - "false"

- audience:
  opts:
    category: Authentication
    title: OIDC token audience
    summary: Audience for the Bitrise OIDC identity token (e.g. sts.amazonaws.com).
    description: |-
      Used when ambient AWS credentials are not present. Typical value:
      `sts.amazonaws.com`.

- access_key_id:
  opts:
    category: Authentication
    title: AWS Access Key ID
    summary: Static access key used when ambient AWS credentials and OIDC are unavailable.
    is_sensitive: true

- secret_access_key:
  opts:
    category: Authentication
    title: AWS Secret Access Key
    summary: Static secret access key paired with access_key_id.
    is_sensitive: true

- session_name: bitrise-$BITRISE_BUILD_NUMBER
  opts:
    category: Authentication
    title: AWS session name
    summary: Session name for the assumed role.

- build_url: $BITRISE_BUILD_URL
  opts:
    category: Debug
    title: Bitrise build URL
    summary: Unique build URL used to fetch the OIDC identity token.
    is_dont_change_value: true

- build_api_token: $BITRISE_BUILD_API_TOKEN
  opts:
    category: Debug
    title: Bitrise build API token
    summary: Build API token used to fetch the OIDC identity token.
    is_sensitive: true
    is_dont_change_value: true

- verbose: "false"
  opts:
    category: Debug
    title: Enable verbose logging
    summary: Enable additional debug logging (never logs secret values).
    value_options:
    - "true"
    - "false"
